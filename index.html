<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Chat</title>
<style>
  :root { --bg:#212121; --panel:#2f2f2f; --text:#ececec; --muted:#9b9b9b; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding:14px 20px; font-weight:600; border-bottom:1px solid #333; }
  #chat { flex:1; overflow-y:auto; padding:24px 16px; }
  .wrap { max-width:760px; margin:0 auto; }
  .hello { text-align:center; margin-top:18vh; font-size:28px; }
  .hello small { display:block; margin-top:10px; font-size:15px; color:var(--muted); }
  .msg { margin:18px 0; display:flex; }
  .msg.user { justify-content:flex-end; }
  .bubble { max-width:85%; padding:12px 16px; border-radius:18px; line-height:1.5; white-space:pre-wrap; }
  .user .bubble { background:var(--panel); }
  footer { padding:12px 16px 22px; }
  form { max-width:760px; margin:0 auto; display:flex; gap:8px; background:var(--panel); border-radius:28px; padding:8px 8px 8px 20px; }
  input { flex:1; background:transparent; border:0; outline:0; color:var(--text); font-size:16px; }
  button { width:40px; height:40px; border-radius:50%; border:0; background:#fff; color:#000; font-size:18px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  #status { text-align:center; color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>My AI Chat</header>

<div id="chat"><div class="wrap" id="messages">
  <div class="hello" id="hello">How can I help you today?<small>Ask me anything.</small></div>
</div></div>

<footer>
  <form id="form">
    <input id="input" placeholder="Message..." autocomplete="off" autofocus>
    <button id="send" type="submit" disabled>&#8593;</button>
  </form>
  <div id="status">Connecting to bot...</div>
</footer>

<!--
  SETUP (one time):
  In Botpress: open your bot -> Webchat integration (must be installed AND bot must be Published)
  -> Embed / Share -> copy the config script URL (ends in config.js) and paste it below.
-->
<script>
  const BOTPRESS_CONFIG_URL = "PASTE_YOUR_CONFIG_JS_URL_HERE";
</script>

<script src="https://cdn.botpress.cloud/webchat/v3.3/inject.js"></script>
<script>
  const messages = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const statusEl = document.getElementById("status");
  let ready = false;

  function add(role, text) {
    const hello = document.getElementById("hello");
    if (hello) hello.remove();
    const m = document.createElement("div");
    m.className = "msg " + role;
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    m.appendChild(b);
    messages.appendChild(m);
    document.getElementById("chat").scrollTop = 1e9;
  }

  // Load the bot config, then hide Botpress's own bubble since we use our own UI
  const s = document.createElement("script");
  s.src = BOTPRESS_CONFIG_URL;
  s.onerror = () => { statusEl.textContent = "Could not load bot config. Check the config URL and that the bot is published."; };
  document.body.appendChild(s);

  function hookEvents() {
    if (!window.botpress) return setTimeout(hookEvents, 200);
    window.botpress.on("webchat:ready", () => {
      ready = true; send.disabled = false; statusEl.textContent = "";
    });
    window.botpress.on("message", (ev) => {
      // show only replies from the bot, not our own messages
      const msg = ev && (ev.message || ev);
      const isBot = msg && msg.direction === "incoming";
      const text = msg && msg.block && msg.block.text;
      if (isBot && text) add("bot", text);
    });
  }
  hookEvents();

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !ready) return;
    add("user", text);
    input.value = "";
    window.botpress.sendMessage(text);
  });
</script>

<style>
  /* hide Botpress's default floating widget so only our UI shows */
  #bp-web-widget, #bp-web-widget-container, .bpFab, .bpContainer { display:none !important; }
</style>
</body>
</html>
