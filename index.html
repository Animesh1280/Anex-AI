<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anex AI</title>
<style>
  :root {
    --bg: #0b1020;
    --surface: #131a30;
    --surface-2: #1a2342;
    --border: #263056;
    --text: #e9ecf5;
    --muted: #8d97b8;
    --accent: #5b8cff;
    --accent-2: #8a5bff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2550 0%, var(--bg) 60%);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    background: rgba(11, 16, 32, .7); backdrop-filter: blur(10px);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    font-weight: 800; font-size: 18px; color: #fff;
    box-shadow: 0 6px 20px rgba(91, 140, 255, .35);
  }
  .brand h1 { margin: 0; font-size: 18px; letter-spacing: .2px; }
  .brand span { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .online { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f5a524; }
  .dot.ok { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
  .dot.err { background: #ef4444; }
  #newChat {
    margin-left: 16px; background: transparent; color: var(--text); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 10px; cursor: pointer; font-size: 13px;
  }
  #newChat:hover { background: var(--surface-2); }

  /* Chat */
  #chat { flex: 1; overflow-y: auto; padding: 28px 16px 12px; scroll-behavior: smooth; }
  .wrap { max-width: 780px; margin: 0 auto; }

  .welcome { text-align: center; margin-top: 9vh; }
  .welcome .logo { width: 64px; height: 64px; border-radius: 18px; font-size: 32px; margin: 0 auto 20px; }
  .welcome h2 { margin: 0 0 8px; font-size: 30px; }
  .welcome p { margin: 0 0 28px; color: var(--muted); }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .chip {
    text-align: left; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 14px 16px; border-radius: 14px; cursor: pointer; font-size: 14px; line-height: 1.4;
    transition: .15s;
  }
  .chip:hover { border-color: var(--accent); background: var(--surface-2); transform: translateY(-2px); }

  .msg { display: flex; gap: 12px; margin: 18px 0; animation: pop .2s ease; }
  .msg.user { flex-direction: row-reverse; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .avatar {
    flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .msg.user .avatar { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  .bubble {
    max-width: 82%; padding: 12px 16px; border-radius: 16px; line-height: 1.6; font-size: 15px;
    white-space: pre-wrap; word-wrap: break-word;
    background: var(--surface); border: 1px solid var(--border);
  }
  .msg.user .bubble { background: linear-gradient(135deg, var(--accent), #4a6fe0); border: 0; color: #fff; }
  .bubble.error { border-color: #7f1d1d; color: #fca5a5; }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* Composer */
  footer { padding: 10px 16px 18px; }
  form {
    max-width: 780px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 10px 10px 10px 18px;
    transition: border-color .15s, box-shadow .15s;
  }
  form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91, 140, 255, .15); }
  textarea {
    flex: 1; resize: none; background: transparent; border: 0; outline: 0; color: var(--text);
    font: inherit; font-size: 15px; line-height: 1.5; max-height: 160px; padding: 7px 0;
  }
  textarea::placeholder { color: var(--muted); }
  #send {
    flex: none; width: 40px; height: 40px; border-radius: 12px; border: 0; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 18px;
  }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  .note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }

  /* Keep Botpress's own widget out of sight but alive (do NOT use display:none) */
  #bp-web-widget, #bp-web-widget-container, .bpFab, .bpContainer, iframe[title*="Botpress" i] {
    position: fixed !important; left: -9999px !important; top: 0 !important; opacity: 0 !important; pointer-events: none !important;
  }

  @media (max-width: 600px) {
    header { padding: 12px 14px; }
    .online span { display: none; }
    .welcome h2 { font-size: 24px; }
    .bubble { max-width: 88%; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">A</div>
    <h1>Anex AI<span>Your intelligent assistant</span></h1>
  </div>
  <div class="online">
    <div class="dot" id="dot"></div><span id="statusText">Connecting...</span>
    <button id="newChat" type="button">New chat</button>
  </div>
</header>

<div id="chat">
  <div class="wrap" id="messages">
    <div class="welcome" id="welcome">
      <div class="logo">A</div>
      <h2>Hi, I'm Anex AI</h2>
      <p>Ask me anything. I'm here to help.</p>
      <div class="chips">
        <button class="chip" type="button">What can you help me with?</button>
        <button class="chip" type="button">Tell me about your services</button>
        <button class="chip" type="button">How do I get started?</button>
        <button class="chip" type="button">Contact support</button>
      </div>
    </div>
  </div>
</div>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Message Anex AI..." autofocus></textarea>
    <button id="send" type="submit" title="Send">&#10148;</button>
  </form>
  <div class="note">Anex AI can make mistakes. Please verify important information.</div>
</footer>

<!--
  ============ ONE-TIME SETUP ============
  Botpress -> your bot -> Webchat integration (installed + bot PUBLISHED)
  -> Embed/Share -> copy the URL of the script ending in "config.js" and paste it below.
-->
<script>
  const BOTPRESS_CONFIG_URL = "PASTE_YOUR_CONFIG_JS_URL_HERE";
</script>

<script src="https://cdn.botpress.cloud/webchat/v3.3/inject.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const messagesEl = $("messages"), chatEl = $("chat"), input = $("input"), sendBtn = $("send");
  const dot = $("dot"), statusText = $("statusText");

  let ready = false;
  let lastUserText = "";
  let typingEl = null;
  let typingTimer = null;
  const queue = [];

  function setStatus(kind, text) {
    dot.className = "dot " + (kind || "");
    statusText.textContent = text;
  }
  function scrollDown() { chatEl.scrollTop = chatEl.scrollHeight; }

  function addMessage(role, text, isError) {
    const w = $("welcome"); if (w) w.remove();
    const m = document.createElement("div");
    m.className = "msg " + role;
    const a = document.createElement("div");
    a.className = "avatar"; a.textContent = role === "user" ? "You" : "A";
    const b = document.createElement("div");
    b.className = "bubble" + (isError ? " error" : "");
    b.textContent = text;
    m.appendChild(a); m.appendChild(b);
    messagesEl.appendChild(m);
    scrollDown();
  }

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement("div");
    typingEl.className = "msg bot";
    typingEl.innerHTML = '<div class="avatar">A</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
    messagesEl.appendChild(typingEl);
    scrollDown();
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      hideTyping();
      addMessage("bot", "I didn't get a reply. Please try again in a moment.", true);
    }, 45000);
  }
  function hideTyping() {
    clearTimeout(typingTimer);
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  // ---- Botpress connection ----
  function bp() { return window.botpress; }

  function deliver(text) {
    try {
      const b = bp();
      try { b.open(); } catch (e) {}
      const r = b.sendMessage(text);
      if (r && r.catch) r.catch((err) => fail("Could not send: " + (err && err.message || err)));
    } catch (e) {
      fail("Could not send: " + e.message);
    }
  }
  function fail(msg) {
    hideTyping();
    addMessage("bot", msg, true);
  }
  function markReady() {
    if (ready) return;
    ready = true;
    setStatus("ok", "Online");
    while (queue.length) deliver(queue.shift());
  }

  function extractText(ev) {
    const m = (ev && (ev.message || ev)) || {};
    return (
      (m.block && m.block.text) ||
      (m.payload && m.payload.text) ||
      (m.text) ||
      (m.block && m.block.title) || ""
    );
  }

  function hookEvents() {
    const b = bp();
    if (!b || typeof b.on !== "function") return setTimeout(hookEvents, 200);

    b.on("webchat:ready", markReady);
    b.on("webchat:initialized", markReady);
    b.on("webchat:opened", markReady);

    b.on("message", (ev) => {
      const m = (ev && (ev.message || ev)) || {};
      const text = extractText(ev);
      if (!text) return;
      const fromUser = m.direction === "outgoing" || (!m.direction && text === lastUserText);
      if (fromUser) return;
      hideTyping();
      addMessage("bot", text);
    });
  }

  // Load bot config
  if (!BOTPRESS_CONFIG_URL || BOTPRESS_CONFIG_URL.indexOf("PASTE_") === 0) {
    setStatus("err", "Not configured");
    addMessage("bot", "Setup needed: open index.html and paste your Botpress config.js URL into BOTPRESS_CONFIG_URL.", true);
  } else {
    const s = document.createElement("script");
    s.src = BOTPRESS_CONFIG_URL;
    s.onload = () => { hookEvents(); setTimeout(markReady, 3500); };
    s.onerror = () => {
      setStatus("err", "Offline");
      addMessage("bot", "Couldn't load the bot. Check that the config URL is correct and the bot is published in Botpress.", true);
    };
    document.body.appendChild(s);
  }

  // ---- UI behaviour ----
  function sendMessage(text) {
    text = (text || "").trim();
    if (!text) return;
    lastUserText = text;
    addMessage("user", text);
    showTyping();
    if (ready) deliver(text); else queue.push(text);
    input.value = ""; autosize();
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); sendMessage(input.value); });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(input.value); }
  });
  document.querySelectorAll(".chip").forEach((c) =>
    c.addEventListener("click", () => sendMessage(c.textContent))
  );
  $("newChat").addEventListener("click", () => location.reload());
})();
</script>
</body>
</html>
